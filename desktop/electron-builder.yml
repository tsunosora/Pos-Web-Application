appId: com.pospro.desktop
productName: POS Pro
copyright: POS Pro

directories:
  output: release
  buildResources: build

# Yang masuk ke app.asar (main process Electron).
files:
  - dist/**/*
  - package.json

# Frontend Next (output "standalone") disertakan sebagai resources, BUKAN di dalam asar.
# Layout hasil: <resources>/frontend/server.js + node_modules + .next/{server,static} + public.
# Dijalankan next-server.ts via Electron-as-Node. Standalone build WAJIB ada dulu
# (node scripts/build-frontend.mjs).
extraResources:
  # Frontend (Next standalone)
  - from: ../frontend/.next/standalone
    to: frontend
    filter:
      - "**/*"
  - from: ../frontend/.next/static
    to: frontend/.next/static
    filter:
      - "**/*"
  - from: ../frontend/public
    to: frontend/public
    filter:
      - "**/*"
  # Backend NestJS (mode 100% offline) — dist + node_modules + prisma engine + migrations.
  # Entry dijalankan: <resources>/backend/dist/src/main.js (Electron-as-Node).
  - from: ../backend/dist
    to: backend/dist
    filter: ["**/*"]
  - from: ../backend/node_modules
    to: backend/node_modules
    filter: ["**/*"]
  - from: ../backend/prisma
    to: backend/prisma
    filter: ["**/*"]
  - from: ../backend/package.json
    to: backend/package.json
  # MariaDB portable per-OS. Taruh biner di desktop/mariadb/ (bin/ + sbin/ + share/).
  # Windows: unduh "MariaDB xx.x ZIP" → ekstrak isinya ke desktop/mariadb/.
  - from: mariadb
    to: mariadb
    filter: ["**/*"]

win:
  target:
    - nsis
  # icon: build/icon.ico   # taruh ikon di desktop/build/icon.ico (opsional)

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: POS Pro

# Auto-update: lokasi installer + latest.yml. GANTI url dengan server Anda (repo private
# → pakai generic ke server sendiri, bukan GitHub, agar tak perlu token). Upload hasil
# build (.exe + latest.yml) ke folder ini tiap rilis. electron-updater membaca latest.yml.
publish:
  provider: generic
  url: https://GANTI-DENGAN-SERVER-ANDA/updates/
